[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-gen"
version = "0.9.0rc2"
authors = [{ name = "Belinda Mo", email = "justanexperimentpark@gmail.com" }]
description = "Extract a knowledge graph using LLMs from any text"
readme = "README.md"
requires-python = ">=3.10, <4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.108.1",
    "sentence-transformers>=5.1.0",
    "tqdm>=4.67.1",
    "semhash>=0.3.2",
    "rank-bm25>=0.2.2",
    "networkx>=3.0",
    "typer>=0.17.4",
    "requests-oauthlib>=2.0.0",
    "pydantic-settings>=2.11.0",
    "rapidfuzz>=3.14.5",
    "rdflib>=7.6.0",
    "uvicorn[standard]>=0.37.0",
    "fastapi>=0.121.3",
    "python-multipart>=0.0.20",
    "torch>=2.12.0",
    "inflect>=7.5.0",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
    "dspy>=3.2.1",
]

[project.optional-dependencies]
# Optional MCP server support. Install with `pip install 'kg-gen[mcp]'` or, with
# uv, `uv sync --extra mcp`. Enables the in-process MCP server mounted at /mcp.
mcp = ["fastmcp>=2.10.6", "mcp>=1.12.1"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
    "ty>=0.0.1a21",
    "datasets>=4.4.1",
    "huggingface-hub>=0.35.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
    "wikipedia-api>=0.8.1",
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "streamlit>=1.51.0",
    "seaborn>=0.13.2",
    "nltk>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kg_gen"]

[tool.pytest.ini_options]
# All tests (including the MCP tool tests) live under tests/. pythonpath makes
# the src package, the repo root (for `app`), and the mcp/ dir (for `tools`)
# importable so the whole suite runs with a single `pytest` invocation.
testpaths = ["tests"]
pythonpath = [".", "src", "mcp"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
