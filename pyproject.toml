[project]
name = "kg-gen"
version = "0.5.0"
authors = [{ name = "Belinda Mo", email = "justanexperimentpark@gmail.com" }]
description = "Extract a knowledge graph using LLMs from any text"
readme = "README.md"
requires-python = ">=3.10, <4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
    "pre-commit>=4.3.0",
    "ty>=0.0.1a21",
    "openai>=1.108.1",
    "sentence-transformers>=5.1.0",
    "tqdm>=4.67.1",
    "datasets>=4.4.1",
    "semhash>=0.3.2",
    "rank-bm25>=0.2.2",
    "networkx>=3.0",
    "dspy-ai>=3.0.4",
    "pathlib2>=2.3.7",
    "typer>=0.17.4",
    "ruff>=0.14.2",
    "requests-oauthlib>=2.0.0",
    "pydantic-settings>=2.11.0",
    "rapidfuzz>=3.14.5",
    "rdflib>=7.6.0",
    "uvicorn[standard]>=0.37.0",
    "fastapi>=0.121.3",
    "python-multipart>=0.0.20",
    "torch>=2.12.0",
    "inflect>=7.5.0",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "datasets>=4.1.1",
    "huggingface-hub>=0.35.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
    "wikipedia-api>=0.8.1",
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "streamlit>=1.51.0",
    "seaborn>=0.13.2",
]
mcp = ["fastmcp>=2.10.6", "mcp>=1.12.1"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp/tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
