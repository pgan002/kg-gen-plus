services:
  server:
    image: ${IMAGE_NAME}:0.10.0rc2
    container_name: kg-gen-server
    command: --port 8000
    volumes:
      - kggen-logs:/workspace/logs:rw
      - kggen-hf-cache:/workspace/cache:rw
    ports:
      - ${PORT:-5000}:8000
    env_file:
      - .env
    environment:
      - "DSPY_CACHEDIR=/workspace/cache/dspy_cache"
    restart: unless-stopped

volumes:
  kggen-hf-cache:
  kggen-logs:
