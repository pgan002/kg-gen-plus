version: 1
disable_existing_loggers: False
formatters:
  default:
    format: '[%(asctime)s] [%(threadName)s] [%(name)s] %(levelname)s - %(message)s'
handlers:
  main_log_file:
    formatter: default
    class: logging.FileHandler
    filename: logs/main.log
    mode: a
  access_log_file:
    formatter: default
    class: logging.FileHandler
    filename: logs/access.log
    mode: a
  uvicorn_log_file:
    formatter: default
    class: logging.FileHandler
    filename: logs/uvicorn.log
    mode: a
  console:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: DEBUG
    handlers: [ console, uvicorn_log_file ]
    propagate: no
  uvicorn.access:
    level: DEBUG
    handlers: [ console, access_log_file ]
    propagate: no
  elastic_transport.transport:
    level: WARNING
  botocore:
    level: WARNING
  filelock:
    level: WARNING
  urllib3:
    level: INFO
  urllib3.connectionpool:
    level: ERROR
    propagate: no
  python_multipart.multipart:
    level: WARNING
  kg_gen_app:
    level: DEBUG
    handlers: [ console, main_log_file ]
root:
  level: DEBUG
  handlers: [ console, main_log_file ]
  propagate: no
