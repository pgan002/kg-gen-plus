# Formatters, levels and logger->handler wiring live here. The *file* handlers
# below are rewritten at startup by app/logging_setup.py, which resolves
# KGGEN_LOG_DIR, switches them to RotatingFileHandler with size limits, suffixes
# the filename with the process role, and drops them entirely if the directory is
# not writable (so a permission problem degrades to stdout instead of failing
# startup). Filenames here are therefore bare names, not paths.
version: 1
disable_existing_loggers: False
formatters:
  default:
    format: '[%(asctime)s] [%(threadName)s] [%(name)s] %(levelname)s - %(message)s'
handlers:
  main_log_file:
    formatter: default
    class: logging.FileHandler
    filename: main.log
  access_log_file:
    formatter: default
    class: logging.FileHandler
    filename: access.log
  uvicorn_log_file:
    formatter: default
    class: logging.FileHandler
    filename: uvicorn.log
  console:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: DEBUG
    handlers: [ console, uvicorn_log_file ]
    propagate: no
  uvicorn.access:
    level: DEBUG
    handlers: [ console, access_log_file ]
    propagate: no
  elastic_transport.transport:
    level: WARNING
  botocore:
    level: WARNING
  filelock:
    level: WARNING
  urllib3:
    level: INFO
  urllib3.connectionpool:
    level: ERROR
    propagate: no
  python_multipart.multipart:
    level: WARNING
  kg_gen_app:
    level: DEBUG
    handlers: [ console, main_log_file ]
    propagate: no
  openai:
    level: WARNING
  httpcore:
    level: WARNING
  asyncio:
    level: WARNING
root:
  level: DEBUG
  handlers: [ console, main_log_file ]
  propagate: no
